name: Execute validated firmware cleanup v3

on:
  push:
    branches:
      - ble-only-firmware-cleanup
    paths:
      - '.github/workflows/execute-validated-cleanup-v3.yml'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: ble-only-firmware-cleanup
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare executor
        run: python3 .github/scripts/prepare_executor_v2.py

      - name: Run validated cleanup
        id: cleanup
        shell: bash
        run: |
          set +e
          python3 .github/scripts/apply_validated_firmware_cleanup.py > /tmp/cleanup-executor.log 2>&1
          status=$?
          cat /tmp/cleanup-executor.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish diagnostic log on failure
        if: ${{ steps.cleanup.outputs.status != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ble-only-firmware-cleanup
          git reset --hard origin/ble-only-firmware-cleanup
          cp /tmp/cleanup-executor.log cleanup-executor.log
          rm -f .github/workflows/execute-validated-cleanup-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: record validated cleanup v3 failure'
          git push origin HEAD:ble-only-firmware-cleanup

      - name: Fail after publishing diagnostic
        if: ${{ steps.cleanup.outputs.status != '0' }}
        run: exit 1
