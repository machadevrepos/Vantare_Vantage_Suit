name: Fix remote transfer lifecycle

on:
  pull_request:
    branches:
      - 2nd_Branch
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: fix-remote-transfer-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    if: >-
      github.repository == 'machadevrepos/Vantare_Vantage_Suit' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ble-only-firmware-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact reviewed blobs
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          main_blob="$(git hash-object Firmware/Master/Core/Src/main.c)"
          if grep -Fq 'bool remote_state_accepted = false;' Firmware/Master/Core/Src/main.c; then
            echo 'patch_required=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$main_blob" = 'd8c1d891e6935d214b139cc44f884e864e56897a'
          test "$(git hash-object Firmware/Master/Core/Inc/HUB_LEAF_BLE_MANAGER.h)" = '8b4b5ef75998144a5e0255611437dd2c3cf84a85'
          test "$(git hash-object Firmware/HostTests/test_coderabbit_firmware_regressions.cpp)" = 'ca8c734a7f1436c58bc836f86469fb581e50eca5'
          test "$(git hash-object Firmware/HostTests/test_ble_only_cleanup.py)" = '116b2fa029895f196677dc37a09159ea3a373982'
          echo 'patch_required=true' >> "$GITHUB_OUTPUT"

      - name: Prove current regression is red
        if: steps.guard.outputs.patch_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if g++ -std=c++17 -Wall -Wextra -Werror \
              -I Firmware/Master/Core/Inc \
              -I Firmware/LIBRARY/CUSTOM \
              Firmware/HostTests/test_coderabbit_firmware_regressions.cpp \
              -o /tmp/test_coderabbit_firmware_regressions_red \
              2>/tmp/remote-lifecycle-red.log; then
            echo 'Expected current lifecycle regression binary to fail before the API fix' >&2
            exit 1
          fi
          grep -Fq 'on_ble_reliable_pause' /tmp/remote-lifecycle-red.log

      - name: Add source guard before production fix
        if: steps.guard.outputs.patch_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Firmware/HostTests/test_ble_only_cleanup.py')
          text = path.read_text()
          old = '''    for call in main_lifecycle_calls:
        if call not in master_main:
            failures.append(f"Master remote lifecycle dispatch lacks call: {call}")

    held_verify = function_body(
'''
          new = '''    for call in main_lifecycle_calls:
        if call not in master_main:
            failures.append(f"Master remote lifecycle dispatch lacks call: {call}")

    ble_write_start = master_main.find('extern "C" uint8_t exo_hub_ble_write')
    remote_start = master_main.find(
        "case exo::RecordReliableType::Pause:", ble_write_start
    )
    remote_end = master_main.find(
        "case exo::RecordReliableType::VerifyOk:", remote_start
    )
    remote_lifecycle = (
        master_main[remote_start:remote_end]
        if ble_write_start >= 0 and remote_start >= 0 and remote_end >= 0
        else ""
    )
    runtime_cancel_guards = (
        "bool remote_state_accepted = false;",
        "remote_state_accepted = leaf_ble_manager.on_ble_reliable_pause",
        "remote_state_accepted = leaf_ble_manager.on_ble_reliable_resume",
        "remote_state_accepted = leaf_ble_manager.on_ble_reliable_cancel",
        "type == exo::RecordReliableType::Cancel && remote_state_accepted",
        "g_remote_transfer_source_id == hdr.source_id",
        "g_remote_transfer_session_id == hdr.session_id",
        "g_remote_transfer_active = false;",
        "g_remote_transfer_source_id = 0U;",
        "g_remote_transfer_session_id = 0U;",
        "start_next_pending_node_manifest_now();",
    )
    if not remote_lifecycle:
        failures.append("Master remote Pause/Resume/Cancel dispatch could not be located")
    else:
        for guard in runtime_cancel_guards:
            if guard not in remote_lifecycle:
                failures.append(f"Master remote Cancel lifecycle lacks guard: {guard}")

    held_verify = function_body(
'''
          if text.count(old) != 1:
              raise SystemExit('cleanup test anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
          if python3 -B Firmware/HostTests/test_ble_only_cleanup.py \
              >/tmp/cleanup-red.out 2>/tmp/cleanup-red.err; then
            echo 'Expected new runtime lifecycle source guard to fail before production fix' >&2
            exit 1
          fi
          grep -Fq 'Master remote Cancel lifecycle lacks guard' /tmp/cleanup-red.err

      - name: Apply minimal lifecycle fix and manager tests
        if: steps.guard.outputs.patch_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_name}: expected one anchor, found {count}')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'Firmware/Master/Core/Inc/HUB_LEAF_BLE_MANAGER.h',
              '''  void on_ble_reliable_pause(uint32_t session_id, uint16_t source_id) {
    if (!owns_transfer_(session_id, source_id)) return;
    paused_ = true;
    receiver_credit_ = 0U;
  }
''',
              '''  bool on_ble_reliable_pause(uint32_t session_id, uint16_t source_id) {
    if (!owns_transfer_(session_id, source_id)) return false;
    paused_ = true;
    receiver_credit_ = 0U;
    return true;
  }
''')

          replace_once(
              'Firmware/Master/Core/Src/main.c',
              '''\t\t\t\t\t} else {
\t\t\t\t\t\tif (type == exo::RecordReliableType::Pause) {
\t\t\t\t\t\t\tleaf_ble_manager.on_ble_reliable_pause(hdr.session_id, hdr.source_id);
\t\t\t\t\t\t} else if (type == exo::RecordReliableType::Resume) {
\t\t\t\t\t\t\tleaf_ble_manager.on_ble_reliable_resume(hdr.session_id, hdr.source_id);
\t\t\t\t\t\t} else {
\t\t\t\t\t\t\tleaf_ble_manager.on_ble_reliable_cancel(hdr.session_id, hdr.source_id);
\t\t\t\t\t\t}
\t\t\t\t\t\t(void) forward_remote_record_control(hdr.source_id, payload, length);
\t\t\t\t\t}
''',
              '''\t\t\t\t\t} else {
\t\t\t\t\t\tbool remote_state_accepted = false;
\t\t\t\t\t\tif (type == exo::RecordReliableType::Pause) {
\t\t\t\t\t\t\tremote_state_accepted = leaf_ble_manager.on_ble_reliable_pause(
\t\t\t\t\t\t\t\t\thdr.session_id, hdr.source_id);
\t\t\t\t\t\t} else if (type == exo::RecordReliableType::Resume) {
\t\t\t\t\t\t\tremote_state_accepted = leaf_ble_manager.on_ble_reliable_resume(
\t\t\t\t\t\t\t\t\thdr.session_id, hdr.source_id);
\t\t\t\t\t\t} else {
\t\t\t\t\t\t\tremote_state_accepted = leaf_ble_manager.on_ble_reliable_cancel(
\t\t\t\t\t\t\t\t\thdr.session_id, hdr.source_id);
\t\t\t\t\t\t}
\t\t\t\t\t\t(void) forward_remote_record_control(hdr.source_id, payload, length);
\t\t\t\t\t\tif (type == exo::RecordReliableType::Cancel && remote_state_accepted &&
\t\t\t\t\t\t\t\tg_remote_transfer_active &&
\t\t\t\t\t\t\t\tg_remote_transfer_source_id == hdr.source_id &&
\t\t\t\t\t\t\t\tg_remote_transfer_session_id == hdr.session_id) {
\t\t\t\t\t\t\tg_remote_transfer_active = false;
\t\t\t\t\t\t\tg_remote_transfer_source_id = 0U;
\t\t\t\t\t\t\tg_remote_transfer_session_id = 0U;
\t\t\t\t\t\t\tstart_next_pending_node_manifest_now();
\t\t\t\t\t\t}
\t\t\t\t\t}
''')

          replace_once(
              'Firmware/HostTests/test_coderabbit_firmware_regressions.cpp',
              '''        if (cancelled.on_ble_reliable_pause(77U, 2U)) return false;
        if (!cancelled.on_ble_reliable_pause(77U, 1U) || !cancelled.paused()) return false;
        if (!cancelled.on_ble_reliable_resume(77U, 1U) || cancelled.paused()) return false;
        if (cancelled.on_ble_session_complete(77U, 1U, first.payload_crc32)) return false;
        if (!cancelled.on_ble_reliable_cancel(77U, 1U)) return false;
''',
              '''        if (cancelled.on_ble_reliable_pause(77U, 2U)) return false;
        if (!cancelled.on_ble_reliable_pause(77U, 1U) || !cancelled.paused()) return false;
        if (cancelled.on_ble_reliable_resume(77U, 2U) || !cancelled.paused()) return false;
        if (!cancelled.on_ble_reliable_resume(77U, 1U) || cancelled.paused()) return false;
        if (cancelled.on_ble_session_complete(77U, 1U, first.payload_crc32)) return false;
        if (cancelled.on_ble_reliable_cancel(77U, 2U)) return false;
        if (cancelled.active_source_id() != 1U || cancelled.active_session_id() != 77U) return false;
        if (!cancelled.on_ble_reliable_cancel(77U, 1U)) return false;
''')
          PY

      - name: Run portable verification
        if: steps.guard.outputs.patch_required == 'true'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          includes=(
            -I Firmware/HostTests/FatFsStub
            -I Firmware/Master/Core/Inc
            -I Firmware/Node/Core/Inc
            -I Firmware/LIBRARY/CUSTOM
          )
          tests=(
            Firmware/HostTests/test_coderabbit_firmware_regressions.cpp
            Firmware/HostTests/test_hub_leaf_ble_manager.cpp
            Firmware/HostTests/test_master_node_reliable_control.cpp
            Firmware/HostTests/test_master_node_transfer_window.cpp
            Firmware/HostTests/test_node_live_sample_queue.cpp
            Firmware/HostTests/test_master_training_csv_formatter_v2.cpp
            Firmware/HostTests/test_coderabbit_csv_logger_regressions.cpp
          )
          for source in "${tests[@]}"; do
            binary="/tmp/$(basename "${source%.cpp}")"
            g++ -std=c++17 -Wall -Wextra -Werror "${includes[@]}" "$source" -o "$binary"
            "$binary"
          done
          python3 -B Firmware/HostTests/test_ble_only_cleanup.py
          git diff --check
          test ! -e remote-transfer-map.txt

      - name: Commit verified fix
        if: steps.guard.outputs.patch_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Firmware/Master/Core/Inc/HUB_LEAF_BLE_MANAGER.h \
                  Firmware/Master/Core/Src/main.c \
                  Firmware/HostTests/test_coderabbit_firmware_regressions.cpp \
                  Firmware/HostTests/test_ble_only_cleanup.py
          git diff --cached --check
          git commit -m 'fix: synchronize remote cancel lifecycle'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
