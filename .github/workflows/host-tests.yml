name: Host Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run invariant tests
        run: python -m pytest host/tests/python -v

  cpp-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S host/tests/cpp -B host/tests/cpp/build
      - name: Build
        run: cmake --build host/tests/cpp/build --config Release --parallel
      - name: Test
        run: ctest --test-dir host/tests/cpp/build --output-on-failure -C Release
