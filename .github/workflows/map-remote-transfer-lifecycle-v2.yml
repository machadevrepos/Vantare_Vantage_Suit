name: Map remote transfer lifecycle v2

on:
  push:
    branches:
      - ble-only-firmware-cleanup
    paths:
      - '.github/workflows/map-remote-transfer-lifecycle-v2.yml'

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ble-only-firmware-cleanup
          fetch-depth: 0
          persist-credentials: true
      - name: Collect lifecycle references
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# main.c remote lifecycle'
            grep -n -C 8 -E 'g_remote_transfer_|release_remote_node_verify_ok|SessionCompleteAck|RecordReliableType::(Pause|Resume|Cancel|VerifyOk)' Firmware/Master/Core/Src/main.c || true
            echo
            echo '# manager lifecycle'
            grep -n -C 8 -E 'active_source_id_|active_session_id_|paused_|on_ble_reliable_(pause|verify_ok)|pop_next_record_done' Firmware/Master/Core/Inc/HUB_LEAF_BLE_MANAGER.h || true
          } > remote-transfer-map.txt
      - name: Publish map
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/map-remote-transfer-lifecycle-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: record remote transfer lifecycle map v2'
          git push origin HEAD:ble-only-firmware-cleanup
