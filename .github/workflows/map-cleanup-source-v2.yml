name: Map BLE cleanup source targets v2

on:
  push:
    branches:
      - ble-only-firmware-cleanup
    paths:
      - '.github/workflows/map-cleanup-source-v2.yml'

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ble-only-firmware-cleanup
          fetch-depth: 0
          persist-credentials: true
      - name: Build source map
        run: python3 .github/scripts/map_cleanup_sources.py
      - name: Commit source map
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/map-cleanup-source-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: refresh BLE cleanup source map'
          git push origin HEAD:ble-only-firmware-cleanup
