name: Docs Lint

on:
  push:
    paths: ['docs/**', 'README.md', '*.md']
  pull_request:
    paths: ['docs/**', 'README.md', '*.md']

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint markdown
        run: |
          npx -y markdownlint-cli@0.41 'docs/**/*.md' 'README.md' \
            --ignore docs/hardware/client-files
