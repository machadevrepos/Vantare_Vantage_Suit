name: Cleanup branch actions probe

on:
  push:
    branches:
      - ble-only-firmware-cleanup
    paths:
      - '.github/workflows/actions-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ble-only-firmware-cleanup
          persist-credentials: true
      - name: Commit probe result and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          printf 'GitHub Actions executed at %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > actions-probe.txt
          rm -f .github/workflows/actions-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: confirm cleanup branch actions'
          git push origin HEAD:ble-only-firmware-cleanup
