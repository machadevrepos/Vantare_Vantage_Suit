name: Apply multi-node integration

on:
  push:
    branches:
      - 2nd_Branch
    paths:
      - tools/patches/multinode-master-owned.patch
      - .github/workflows/apply-multinode-integration.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: 2nd_Branch
          fetch-depth: 0

      - name: Apply implementation patch
        run: git apply --check tools/patches/multinode-master-owned.patch && git apply tools/patches/multinode-master-owned.patch

      - name: Compile and run transfer-window host test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I Firmware/LIBRARY/CUSTOM \
            Firmware/HostTests/test_master_node_transfer_window.cpp \
            -o /tmp/test_master_node_transfer_window
          /tmp/test_master_node_transfer_window

      - name: Check HTML JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('Firmware/DesktopTools/Exoskeleton.html').read_text(encoding='utf-8-sig')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit('No script blocks found')
          Path('/tmp/exoskeleton-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/exoskeleton-inline.js

      - name: Verify implementation markers
        run: |
          grep -q 'MASTER_OWNS_NODE_UPLOAD: true' Firmware/DesktopTools/Exoskeleton.html
          grep -q 'class MasterNodeTransferWindow' Firmware/LIBRARY/CUSTOM/MASTER_NODE_TRANSFER_WINDOW.h
          grep -q 'MASTER_OWNER' Firmware/Master/Core/Src/main.c
          grep -q 'Node4 = 4U' Firmware/LIBRARY/CUSTOM/BLE_RECORD_PROTOCOL.h

      - name: Remove one-use files and commit
        run: |
          git rm tools/patches/multinode-master-owned.patch
          git rm .github/workflows/apply-multinode-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Firmware Docs
          git commit -m 'feat: add master-owned four-node session transfer'
          git push origin HEAD:2nd_Branch
