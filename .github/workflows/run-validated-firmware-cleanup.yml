name: Run validated firmware cleanup

on:
  pull_request:
    types:
      - edited
    branches:
      - 2nd_Branch

permissions:
  contents: write

jobs:
  apply-test-and-publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ble-only-firmware-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: ble-only-firmware-cleanup
          fetch-depth: 0
          persist-credentials: true

      - name: Apply cleanup, regression fixes, and tests
        run: python3 .github/scripts/apply_validated_firmware_cleanup.py
