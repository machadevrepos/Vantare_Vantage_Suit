name: Repair and apply BLE-only cleanup

on:
  pull_request:
    branches:
      - ble-only-firmware-cleanup
    paths:
      - '.cleanup-patch/**'
      - '.github/workflows/apply-ble-cleanup-repair.yml'

permissions:
  contents: write

jobs:
  repair-apply-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify intact patch parts
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            [part-01.b64]=0cffd530b67683b40796fc5d3d8a8ce1ed2aaa51
            [part-02.b64]=f6f61ce45f035b4802461e71bab6a2910cbd2de7
            [part-03.b64]=a6183b4f7b09865db94d6ba4fad0ed653eab6db3
            [part-04.b64]=bbc6921e0604320420c665822ff4c2fed0a7ae77
            [part-05.b64]=776131caf22fbbb5e8b6095fe6c8cccf1ca29625
            [part-06a.b64]=3779523ba418e3066d09eee0521eb6db7264ce69
            [part-07.b64]=16b3febfdf6ce733c88046c2630a1e1a7256c736
            [part-08.b64]=b579c21b18744a6d7c199f1e981dc33210c6eee8
            [part-09.b64]=b7a3748d74f88099ee2fa490b85d3fccd45a066d
          )
          for name in "${!expected[@]}"; do
            path=".cleanup-patch/${name}"
            actual="$(git hash-object "${path}")"
            printf '%s bytes=%s expected=%s actual=%s\n' "${name}" "$(wc -c < "${path}")" "${expected[$name]}" "${actual}"
            test "${actual}" = "${expected[$name]}"
          done
          test "$(wc -c < .cleanup-patch/part-06b.b64)" -eq 8999

      - name: Repair the missing Base64 character
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          source = Path('.cleanup-patch/part-06b.b64').read_bytes()
          target = '11d59b3b3649896bc73c45961f3d49b1ee1ff95a'
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='

          def git_blob_sha(data: bytes) -> str:
              header = f'blob {len(data)}\0'.encode('ascii')
              return hashlib.sha1(header + data).hexdigest()

          for position in range(len(source) + 1):
              prefix = source[:position]
              suffix = source[position:]
              for value in alphabet:
                  candidate = prefix + bytes((value,)) + suffix
                  if git_blob_sha(candidate) == target:
                      Path('/tmp/part-06b.repaired').write_bytes(candidate)
                      print(f'repaired part-06b at offset {position} with {chr(value)!r}')
                      raise SystemExit(0)
          raise SystemExit('unable to reconstruct part-06b from its expected Git blob hash')
          PY
          test "$(git hash-object /tmp/part-06b.repaired)" = "11d59b3b3649896bc73c45961f3d49b1ee1ff95a"

      - name: Reconstruct and verify the original patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .cleanup-patch/part-01.b64 \
            .cleanup-patch/part-02.b64 \
            .cleanup-patch/part-03.b64 \
            .cleanup-patch/part-04.b64 \
            .cleanup-patch/part-05.b64 \
            .cleanup-patch/part-06a.b64 \
            /tmp/part-06b.repaired \
            .cleanup-patch/part-07.b64 \
            .cleanup-patch/part-08.b64 \
            .cleanup-patch/part-09.b64 \
            | base64 --decode | gzip --decompress > /tmp/ble-cleanup.patch
          test "$(sha256sum /tmp/ble-cleanup.patch | awk '{print $1}')" = "539c0486217bfdacd2cfb1adc857350ce58dbda2dde3797bd94e5d60fcdd8116"

      - name: Validate and apply the patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/ble-cleanup.patch
          git apply /tmp/ble-cleanup.patch

      - name: Verify expected target blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Firmware/Master/Core/Src/main.c)" = "8daf733b87ca7af9d4e61adca4dab8a71ef6abd5"
          test "$(git hash-object Firmware/Node/Core/Src/main.c)" = "fa66d023c600f1e9dab30a8982f5a9c94db27a28"
          test "$(git hash-object Firmware/LIBRARY/CUSTOM/ACQUISITION_DIAGNOSTICS.h | cut -c1-7)" = "e1c1881"
          test "$(git hash-object Firmware/Master/tests/test_acquisition_diagnostics_source.ps1 | cut -c1-7)" = "ce4aa1d"
          test "$(git hash-object 'Firmware/Project Details.md' | cut -c1-7)" = "19b181e"

      - name: Run portable verification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Firmware/HostTests/*.py
          g++ -std=c++17 -Wall -Wextra -Werror -DEXO_ACQ_DIAG_HOST_TEST=1 \
            -I Firmware/LIBRARY/CUSTOM \
            Firmware/Master/tests/acquisition_diagnostics_test.cpp \
            -o /tmp/acquisition_diagnostics_test
          /tmp/acquisition_diagnostics_test
          if grep -RInE 'MasterRs485_|HubRs485|master_rs485_recording|node_rs485_recording|comms_rs485|RS485_RECORD_' \
            Firmware/Master Firmware/Node Firmware/LIBRARY/CUSTOM \
            --exclude='*.patch'; then
            echo 'BLE-only cleanup regression: stale RS485 identifiers found' >&2
            exit 1
          fi

      - name: Remove temporary transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cleanup-patch
          rm -f .github/workflows/apply-ble-cleanup.yml
          rm -f .github/workflows/apply-ble-cleanup-repair.yml

      - name: Commit validated cleanup
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove RS485 dead code and update BLE-only architecture'
          git push origin "HEAD:${HEAD_BRANCH}"
